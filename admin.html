<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>后台管理 · 个人作品集</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111'/%3E%3Ctext x='16' y='22' font-family='Helvetica,Arial' font-size='15' font-weight='700' fill='%23fff' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f6f4; --surface:#ffffff; --soft:#fbfbf9;
  --text:#16161a; --dim:#6d6d68; --line:#e2e2dd;
  --accent:#d81e05; --ok:#0a7d3c; --warn:#b3541e;
  --r:10px; --r2:8px;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --sans:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
code{font-family:var(--mono);font-size:.88em;background:#efefe9;padding:1px 5px;border-radius:4px}
.hide{display:none!important}

/* 顶栏 */
.bar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .inner{max-width:1180px;margin:0 auto;padding:0 24px;display:flex;align-items:center;gap:12px;height:62px}
.bar h1{font-size:16px;margin:0;letter-spacing:-.01em;font-weight:800}
.bar .sp{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{font-size:12px;color:var(--dim);border:1px solid var(--line);padding:4px 11px;border-radius:99px;white-space:nowrap}
.pill.dirty{color:var(--warn);border-color:var(--warn);background:#fdf3ee}

/* 主体 */
.admin{max-width:1180px;margin:0 auto;padding:22px 24px 80px;display:grid;grid-template-columns:212px 1fr;gap:26px;align-items:start}
.side{position:sticky;top:84px}
.side h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 10px 8px;font-weight:700}
.side a{display:block;padding:7px 10px;border-radius:var(--r2);font-size:13.5px;color:var(--dim);transition:background .15s,color .15s}
.side a:hover{background:#eee;color:var(--text)}
.side a.on{background:var(--text);color:#fff;font-weight:600}
@media (max-width:980px){.admin{grid-template-columns:1fr}.side{display:none}}

/* 卡片 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,.03);scroll-margin-top:80px}
.card > h2{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin:0 0 16px;font-weight:700;display:flex;align-items:center;gap:10px}
.card > h2::before{content:"";width:14px;height:2px;background:var(--accent)}
.card > .tip{font-size:12.5px;color:var(--dim);margin:-8px 0 16px;line-height:1.65}
.barrow{display:flex;align-items:center;gap:10px;margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);flex-wrap:wrap}
.barrow .hint{margin:0}

label{display:block;font-size:12.5px;font-weight:700;color:var(--dim);margin:14px 0 6px}
label:first-of-type{margin-top:0}
input[type=text],input[type=password],input[type=number],textarea,select{
  width:100%;padding:9px 12px;border:1px solid var(--line);background:var(--soft);
  font:inherit;font-size:14px;color:var(--text);border-radius:var(--r2);transition:border-color .15s,background .15s;
}
textarea{min-height:74px;resize:vertical;line-height:1.65}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(216,30,5,.08)}
.hint{font-size:12.5px;color:var(--dim);margin-top:6px;line-height:1.65}
.check{display:flex;align-items:center;gap:8px;font-weight:400;font-size:13px;color:var(--text);margin-top:10px;cursor:pointer}
.check input{width:auto;margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media (max-width:680px){.row2,.row3{grid-template-columns:1fr}}

button{font:inherit;font-size:14px;font-weight:700;padding:10px 20px;cursor:pointer;border-radius:var(--r2);border:1px solid var(--text);background:var(--text);color:#fff;font-family:var(--sans);transition:opacity .15s,background .15s,border-color .15s}
button:hover{opacity:.87}
button:disabled{opacity:.5;cursor:not-allowed}
.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.ghost:hover{border-color:var(--accent);color:var(--accent);opacity:1}
.danger{background:transparent;color:var(--warn);border-color:var(--line);padding:6px 12px;font-size:12.5px}
.danger:hover{border-color:var(--warn);color:var(--warn);opacity:1}
.mini{padding:6px 13px;font-size:12.5px}
.cp{font-size:12px;font-weight:700;color:var(--dim);border:1px solid var(--line);padding:5px 12px;border-radius:99px;background:transparent;cursor:pointer;font-family:var(--sans)}
.cp:hover{border-color:var(--accent);color:var(--accent);opacity:1}

.item{border:1px solid var(--line);border-radius:var(--r2);padding:16px;margin-bottom:12px;background:var(--soft)}
.item .ih{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.item .ih b{font-size:12px;letter-spacing:.06em;color:var(--dim);font-weight:700}
.item .ih .sp{margin-left:auto;display:flex;gap:7px}

.msg{border:1px solid var(--line);border-radius:var(--r2);padding:12px 16px;margin-bottom:18px;font-size:14px;display:none}
.msg.on{display:block}
.msg.ok{border-color:var(--ok);color:var(--ok);background:#f2faf5}
.msg.err{border-color:var(--warn);color:var(--warn);background:#fdf6f2}

.toast{position:fixed;top:76px;right:22px;z-index:80;padding:12px 20px;border-radius:var(--r2);font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.14);opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:none}
.toast.ok{background:var(--ok);color:#fff}
.toast.err{background:var(--warn);color:#fff}
.toast.info{background:var(--text);color:#fff}

.fabsave{position:fixed;right:22px;bottom:22px;z-index:70;box-shadow:0 8px 24px rgba(0,0,0,.18);display:none;padding:12px 24px}
.fabsave.on{display:block}

#login{max-width:400px;margin:14vh auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:30px}
#login h2{margin:0 0 6px;font-size:22px;letter-spacing:-.01em}
#login p{color:var(--dim);font-size:13.5px;margin:0 0 22px}
footer{border-top:1px solid var(--line);padding:20px 24px 40px;color:var(--dim);font-size:13px;text-align:center}
.upbox{border:1px dashed var(--line);border-radius:var(--r2);padding:12px;background:var(--soft);margin-top:10px}
.upbox .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* 小预览窗口 */
.prevrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.preview{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;max-width:300px}
.preview .thumb{
  width:64px;height:48px;flex-shrink:0;border-radius:5px;border:1px solid var(--line);
  object-fit:cover;background:#f2f2ee;display:grid;place-items:center;
  font-size:9.5px;font-weight:800;color:#fff;letter-spacing:.03em;overflow:hidden;
}
.preview .pmeta{min-width:0;font-size:12px;color:var(--dim);line-height:1.5}
.preview .pmeta b{display:block;font-size:13px;color:var(--text);max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview .pmeta a{color:var(--accent);word-break:break-all}
.preview.pending{opacity:.72}
</style>
</head>
<body>

<!--
  ============================================================
   后台配置：ADMIN_CONFIG
   - PASS_SHA256：登录密码的 SHA-256 哈希
   - 改密码：页面底部「修改管理密码」直接提交，无需改代码
  ============================================================
-->

<div class="bar">
  <div class="inner">
    <h1>作品集 · 后台管理</h1>
    <span class="pill" id="sitePill"></span>
    <div class="sp">
      <span class="pill dirty hide" id="dirtyTip">● 有未保存的修改</span>
      <a class="pill" href="./" target="_blank" rel="noopener">查看前台 ↗</a>
      <a class="pill" href="builder.html" style="background:#16161a;color:#fff;border-color:#16161a">生成与预览 ↗</a>
      <a class="pill" href="./?edit=1" target="_blank" rel="noopener">前台编辑截图 ↗</a>
      <button class="ghost mini" id="logoutBtn" type="button">退出</button>
    </div>
  </div>
</div>

<!-- ========== 登录 ========== -->
<div id="login">
  <h2>管理员登录</h2>
  <p>此页面不对外公开，仅本人使用。</p>
  <form id="loginForm">
    <label for="pw">管理密码</label>
    <input type="password" id="pw" autocomplete="current-password" placeholder="请输入管理密码" autofocus>
    <div style="margin-top:20px"><button type="submit">登录</button></div>
    <div class="msg err" id="loginErr"></div>
  </form>
</div>

<!-- ========== 编辑区 ========== -->
<div class="admin hide" id="panel"></div>
<div class="toast" id="toast"></div>

<footer>个人作品集后台 · 已设置 noindex，不参与搜索收录</footer>

<script src="content.js"></script>
<script>
/* ================= 配置 ================= */
var ADMIN_CONFIG = {
  OWNER: 'hnzzsp',
  REPO: 'portfolio',
  BRANCH: 'main',
  DATA_PATH: 'data.json',
  ADMIN_PATH: 'admin.html',
  PASS_SHA256: '37a0034fb1fae0f18836a858af9b95b2215835b2b67923b69cfc3dfbeb65b40e',
  SESSION_KEY: 'pfAdminAuthed'
};

function sha256(str){
  if (window.crypto && crypto.subtle){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0' + b.toString(16)).slice(-2); }).join('');
    });
  }
  return Promise.reject(new Error('当前环境不支持 crypto.subtle，请用 https 或 localhost 访问。'));
}

/* ================= 登录 ================= */
var authed = sessionStorage.getItem(ADMIN_CONFIG.SESSION_KEY) === '1';
var api = null;
function showPanel(){
  document.getElementById('login').classList.add('hide');
  document.getElementById('panel').classList.remove('hide');
  if (!api && window.PFContent){
    api = PFContent.mount(document.getElementById('panel'));
  }
}
if (authed) showPanel();

document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  sha256(document.getElementById('pw').value).then(function(h){
    if (h === ADMIN_CONFIG.PASS_SHA256){
      sessionStorage.setItem(ADMIN_CONFIG.SESSION_KEY, '1');
      document.getElementById('pw').value = '';
      showPanel();
    } else {
      var er = document.getElementById('loginErr');
      er.className = 'msg err on';
      er.textContent = '密码不正确。';
    }
  }).catch(function(err){
    var er2 = document.getElementById('loginErr');
    er2.className = 'msg err on';
    er2.textContent = err.message;
  });
});
document.getElementById('logoutBtn').addEventListener('click', function(){
  sessionStorage.removeItem(ADMIN_CONFIG.SESSION_KEY);
  location.reload();
});
</script>
</body>
</html>
